spring.application.name=erp-system

server.port=8086

#  PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_system_db
spring.datasource.username=postgres
spring.datasource.password=gmt2025
spring.datasource.driver-class-name=org.postgresql.Driver

#  HikariCP Connection Pool
spring.datasource.hikari.pool-name=BusinessMgmtPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
# Keeps idle connections alive (important for PostgreSQL)
spring.datasource.hikari.keepalive-time=60000

#  JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#  Flyway (recommended for production migrations)
#  Uncomment when you switch away from ddl-auto
#spring.flyway.enabled=true
#spring.flyway.locations=classpath:db/migration
#spring.flyway.baseline-on-migrate=true

#  Logging
logging.level.root=INFO
logging.level.com.business.management=DEBUG
# Uncomment to see generated SQL
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#  Jackson (JSON)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

#  File Upload (for attachments, documents)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
# Local storage base directory (override with S3 config in prod)
app.file.upload-dir=./uploads


#  JWT Configuration
app.jwt.secret=bXlTdXBlclNlY3VyZUVSUEp3dFNlY3JldEtleUZvckF1dGhlbnRpY2F0aW9uMjAyNQ==
# Access token: 15 minutes (ms)
app.jwt.access-token-expiration-ms=900000
# Refresh token: 7 days (ms)
app.jwt.refresh-token-expiration-ms=604800000
# Refresh token cookie name
app.jwt.refresh-token-cookie-name=erp_refresh_token

#  Actuator (health checks)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

erp.customer.regular.min-orders=3
erp.customer.regular.lookback-months=6
erp.customer.regular.min-total-spend=10000
erp.customer.regular.cron=0 0 2 * * *
