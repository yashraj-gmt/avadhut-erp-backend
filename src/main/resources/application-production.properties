# ============================================================
# Production Spring Profile — ERP System
# Activated by: java -jar erp-system.jar --spring.profiles.active=production
#
# All secrets come from /opt/erp/.env.production (loaded via
# systemd EnvironmentFile=) — NEVER hardcode secrets here.
# ============================================================

spring.application.name=erp-system

# ── Server ──────────────────────────────────────────────────
server.port=8086

# ── PostgreSQL (credentials from env vars) ─────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ────────────────────────────────
spring.datasource.hikari.pool-name=ErpProdPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# IMPORTANT: Use 'validate' in production — never 'update' or 'create'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Logging (reduce verbosity in production) ────────────────
logging.level.root=WARN
logging.level.com.erp=INFO
logging.level.org.springframework.security=WARN

# ── Jackson (JSON) ──────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ── File Upload (Multipart) ─────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Upload dir kept for fallback / local dev on server
# In production, SpacesFileStorageService handles uploads (overrides this)
app.file.upload-dir=/var/www/erp/uploads

# ── DigitalOcean Spaces (S3-compatible) ─────────────────────
# Values come from environment variables (see .env.production.template)
spaces.access-key=${SPACES_ACCESS_KEY}
spaces.secret-key=${SPACES_SECRET_KEY}
spaces.endpoint=${SPACES_ENDPOINT}
spaces.region=${SPACES_REGION}
spaces.bucket=${SPACES_BUCKET}
spaces.cdn-url=${SPACES_CDN_URL}

# ── JWT Configuration ────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
# Access token: 15 minutes
app.jwt.access-token-expiration-ms=900000
# Refresh token: 7 days
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.refresh-token-cookie-name=erp_refresh_token

# ── CORS ─────────────────────────────────────────────────────
# Nginx handles /api proxying so frontend and backend share the same origin
# If you later add a domain, update this value accordingly
app.cors.allowed-origins=http://165.232.186.76

# ── Actuator (health checks) ─────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
