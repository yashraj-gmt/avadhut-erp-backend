spring.application.name=erp-system

server.port=8086

# ?? PostgreSQL ????????????????????????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_system_db
spring.datasource.username=erp_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? HikariCP ??????????????????????????????????????????????????????????????
spring.datasource.hikari.pool-name=ErpProdPool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# ?? JPA / Hibernate ???????????????????????????????????????????????????????
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ?? File Upload ???????????????????????????????????????????????????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.file.upload-dir=/var/www/erp/uploads

# ?? JWT ???????????????????????????????????????????????????????????????????
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.refresh-token-cookie-name=erp_refresh_token

# ?? Cookie ????????????????????????????????????????????????????????????????
app.cookie.secure=false

# ?? Jackson ???????????????????????????????????????????????????????????????
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ?? Logging ???????????????????????????????????????????????????????????????
logging.level.root=WARN
logging.level.com.erp.system=INFO
logging.file.name=/var/log/erp/backend.log
logging.file.max-size=10MB
logging.file.max-history=7

# ?? Actuator ??????????????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized